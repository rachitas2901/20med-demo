name: Validate hub

on:
  pull_request:
    paths:
      - avd-code-final/avd-landing-zone/main-hub.bicep
      - avd-code-final/avd-landing-zone/parameters/hub.prod.bicepparam
      - avd-code-final/avd-landing-zone/modules/network/hubVnet.bicep
      - avd-code-final/avd-landing-zone/modules/security/firewall.bicep
      - avd-code-final/avd-landing-zone/modules/security/firewallPolicy.bicep
      - avd-code-final/avd-landing-zone/modules/connectivity/**
      - .github/workflows/validate-hub.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: avd-hub-validate-${{ github.ref }}
  cancel-in-progress: false

env:
  TEMPLATE_FILE: avd-code-final/avd-landing-zone/main-hub.bicep
  HUB_PARAMETERS: avd-code-final/avd-landing-zone/parameters/hub.prod.bicepparam
  DEPLOYMENT_LOCATION: centralindia

jobs:
  build:
    name: Build hub template
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bicep
        uses: azure/setup-bicep@v2

      - name: Compile hub template and parameters
        run: |
          bicep build "$TEMPLATE_FILE" --outfile "$RUNNER_TEMP/main-hub.json"
          bicep build-params "$HUB_PARAMETERS" --outfile "$RUNNER_TEMP/hub.parameters.json"

  what-if:
    name: Preview hub deployment
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Confirm subscription and tenant
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          EXPECTED_SUBSCRIPTION_NAME: ${{ vars.EXPECTED_SUBSCRIPTION_NAME }}
        run: bash .github/scripts/assert-azure-context.sh

      - name: What-if hub
        run: |
          az deployment sub what-if \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$HUB_PARAMETERS" \
            --name "avd-hub-whatif-${GITHUB_RUN_ID}" \
            --no-prompt
